<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORYND CAD Bridge</title>

<!-- ORYND brand fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<!-- React + Babel (pinned, same as design prototype) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- ORYND design system -->
<link rel="stylesheet" href="_ds/orynd-ai-design-system-4c16c3b2-d926-45e8-90c1-7f084df96f3c/colors_and_type.css">
<script src="_ds/orynd-ai-design-system-4c16c3b2-d926-45e8-90c1-7f084df96f3c/_ds_bundle.js"></script>

<!-- CAD Bridge theme -->
<link rel="stylesheet" href="cad/cad-theme.css">

<!-- Lucide icons -->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg, #1a1916); }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- OryndApp dependency chain (gallery/showcase files intentionally omitted) -->
<script type="text/babel" src="cad/cad-icons.jsx"></script>
<script type="text/babel" src="cad/cad-components.jsx"></script>
<script type="text/babel" src="cad/cad-taskpane.jsx"></script>
<script type="text/babel" src="cad/cad-dashboard.jsx"></script>
<script type="text/babel" src="cad/cad-selection.jsx"></script>
<script type="text/babel" src="cad/cad-screens.jsx"></script>
<script type="text/babel" src="cad/cad-app.jsx"></script>

<!-- mount the live task pane -->
<script type="text/babel" data-presets="react">
(function mount() {
  if (!window.OryndApp) { setTimeout(mount, 30); return; }
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(window.OryndApp)
  );
})();
</script>
</body>
</html>
