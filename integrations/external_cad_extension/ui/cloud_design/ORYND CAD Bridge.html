<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORYND CAD Bridge — Task Pane System</title>

<!-- ORYND brand fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- ORYND design system (binding) -->
<link rel="stylesheet" href="_ds/orynd-ai-design-system-4c16c3b2-d926-45e8-90c1-7f084df96f3c/colors_and_type.css">
<script src="_ds/orynd-ai-design-system-4c16c3b2-d926-45e8-90c1-7f084df96f3c/_ds_bundle.js"></script>

<!-- CAD Bridge theme -->
<link rel="stylesheet" href="cad/cad-theme.css">

<!-- Lucide icons (brand-correct: ORYND spec = Lucide/Feather lineage) -->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1a1916"/>
    <rect x="30" y="22" width="40" height="56" rx="5" fill="#221f19" stroke="#3b372e"/>
    <circle cx="50" cy="42" r="11" fill="none" stroke="#e2531a" stroke-width="2.5"/>
    <path d="M50 33v5M50 46v5M41 42h5M54 42h5" stroke="#e2531a" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="36" y="60" width="28" height="4" rx="2" fill="#3b372e"/>
    <rect x="36" y="67" width="18" height="4" rx="2" fill="#3b372e"/>
  </svg>
</template>

<!-- component sources (order matters: icons → components → taskpane/flow/showcase → canvas → app) -->
<script type="text/babel" src="cad/cad-icons.jsx"></script>
<script type="text/babel" src="cad/cad-components.jsx"></script>
<script type="text/babel" src="cad/cad-taskpane.jsx"></script>
<script type="text/babel" src="cad/cad-dashboard.jsx"></script>
<script type="text/babel" src="cad/cad-selection.jsx"></script>
<script type="text/babel" src="cad/cad-screens.jsx"></script>
<script type="text/babel" src="cad/cad-app.jsx"></script>
<script type="text/babel" src="cad/cad-flow.jsx"></script>
<script type="text/babel" src="cad/cad-showcase.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" data-presets="react">
(function () {
const { DesignCanvas, DCSection, DCArtboard } = window;
const { Foundations, Frame } = window.SHOW;
const C = window.CAD;
const I = window.CADIcons;
const h = React.createElement;

// gallery cards get a transparent auto-height shell so they hug their content
const GAL = { height: 'auto', background: 'transparent', boxShadow: 'none', borderRadius: 14, overflow: 'visible' };
// full task panes: fixed dark card, internal scroll
const PANE = { background: 'var(--surface)', borderRadius: 16, boxShadow: '0 30px 60px -30px rgba(0,0,0,.7)' };

// ---- component gallery items ----
function Gallery() {
  const item = (label, w, node) =>
    h(Frame, { w }, h('div', { className: 'tp-eyebrow', style: { marginBottom: 11 } }, label), node);

  return [
    h(DCArtboard, { id: 'g-header', label: 'Header', width: 400, height: 130, style: GAL, key: 'g1' },
      h(Frame, { w: 400, pad: 0 },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 0 } },
          h(C.Header, { connection: 'connected', route: 'ORYND' }),
          h(C.Header, { connection: 'offline', route: 'BYO Claude' }),
        ))),

    h(DCArtboard, { id: 'g-timeline', label: 'Status timeline', width: 560, height: 110, style: GAL, key: 'g2' },
      h(Frame, { w: 560, pad: 0 },
        h(C.Timeline, { active: 0 }),
        h(C.Timeline, { active: 3 }),
        h(C.Timeline, { active: 6 }),
        h(C.Timeline, { active: 3, failedAt: 3 }),
      )),

    h(DCArtboard, { id: 'g-msgs', label: 'Messages', width: 400, height: 200, style: GAL, key: 'g3' },
      item('USER + ASSISTANT', 400, h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
        h(C.UserMsg, { text: 'Create a ventilated brake disc, Ø320.', files: [{ kind: 'sketch', name: 'rotor.svg' }] }),
        h(C.AssistMsg, { em: 'intent.' }, 'Reading your request — I\'ll plan this as a parametric disc and confirm design'),
      ))),

    h(DCArtboard, { id: 'g-steps', label: 'Agent step cards', width: 400, height: 240, style: GAL, key: 'g4' },
      item('STATUSES', 400, h('div', { style: { display: 'flex', flexDirection: 'column', gap: 7 } },
        h(C.StepCard, { status: 'done', title: 'Understood design intent', detail: 'Vented rotor · 5-bolt hub' }),
        h(C.StepCard, { status: 'active', title: 'Building operation plan', detail: 'Mapping to runtime commands' }),
        h(C.StepCard, { status: 'warn', title: 'Vane geometry simplified', detail: 'Not in runtime command set' }),
        h(C.StepCard, { status: 'failed', title: 'Extrude depth undefined' }),
        h(C.StepCard, { status: 'pending', title: 'Export STEP' }),
      ))),

    h(DCArtboard, { id: 'g-research', label: 'Research card', width: 400, height: 300, style: GAL, key: 'g5' },
      h(Frame, { w: 400, pad: 0 }, h(C.ResearchCard, {
        sources: [{ title: 'Brake rotor PCD standards', url: 'tech/pcd' }, { title: '5×114.3 hub spec', url: 'oem/hub' }],
        facts: ['PCD 114.3 mm, 5 bolts', 'Center bore 67.1 mm'], confidence: 0.86,
      }))),

    h(DCArtboard, { id: 'g-plan', label: 'Operation plan card', width: 400, height: 460, style: GAL, key: 'g6' },
      h(Frame, { w: 400, pad: 0 }, h(C.OperationPlanCard, {
        cmds: ['sketch', 'circle', 'extrude', 'hole', 'pattern', 'fillet', 'export'],
        ops: [
          { title: 'Sketch disc profile on Front plane', dim: 'Ø320 outer · Ø67.1 bore' },
          { title: 'Extrude boss', dim: 'thickness 26 mm' },
          { title: 'Circular pattern · 5× Ø14 bolts', dim: 'PCD 114.3 · 72°' },
          { title: 'Edge fillet + export STEP', dim: 'r 2 mm' },
        ],
        assumptions: ['Center bore 67.1 mm inferred from 5×114.3 hub.'],
        warnings: ['Ventilation vanes exported as solid — not in runtime set.'],
      }))),

    h(DCArtboard, { id: 'g-valid', label: 'Validation · pass + fail', width: 400, height: 460, style: GAL, key: 'g7' },
      h(Frame, { w: 400, pad: 0 },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
          h(C.ValidationCard, { result: 'valid', safety: ['No shell calls', 'No network access', 'No delete / filesystem writes'] }),
          h(C.ValidationCard, { result: 'failed', errors: ['Extrude depth 0 mm — thickness undefined.', 'Bolt Ø14 overlaps center bore.'], warnings: ['Vane geometry not in runtime set.'] }),
        ))),

    h(DCArtboard, { id: 'g-macro', label: 'Macro preview card', width: 400, height: 420, style: GAL, key: 'g8' },
      h(Frame, { w: 400, pad: 0 }, h(C.MacroCard, { filename: 'brake_disc.swp', lang: 'VBA', lines: window.__MACRO }))),

    h(DCArtboard, { id: 'g-gate', label: 'Approval gate', width: 400, height: 300, style: GAL, key: 'g9' },
      h(Frame, { w: 400, pad: 0 },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
          h(C.ApprovalGate, {}),
          h(C.ApprovalGate, { disabled: true }),
        ))),

    h(DCArtboard, { id: 'g-exec', label: 'Execution card', width: 400, height: 290, style: GAL, key: 'g10' },
      h(Frame, { w: 400, pad: 0 }, h(C.ExecutionCard, {
        progress: 64, steps: [
          { status: 'done', title: 'Created part', detail: 'brake_disc.sldprt' },
          { status: 'active', title: 'Cutting bolt circle', detail: '5× Ø14' },
          { status: 'pending', title: 'Exporting STEP' },
        ],
      }))),

    h(DCArtboard, { id: 'g-result', label: 'Result card', width: 400, height: 360, style: GAL, key: 'g11' },
      h(Frame, { w: 400, pad: 0 }, h(C.ResultCard, {
        files: [
          { name: 'brake_disc.step', size: '2.4 MB', primary: true },
          { name: 'brake_disc.swp', size: '3 KB' },
          { name: 'operation_plan.json', size: '1.8 KB' },
        ],
      }))),

    h(DCArtboard, { id: 'g-banner', label: 'Banners · disconnected + blocked', width: 400, height: 280, style: GAL, key: 'g12' },
      h(Frame, { w: 400, pad: 0 },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
          h(C.Banner, { kind: 'off', title: 'SolidWorks is disconnected', text: 'The validated plan and macro are preserved. Reconnect to run.', action: { label: 'Reconnect', icon: I.Plug } }),
          h(C.Banner, { kind: 'blocked', title: 'Trial limit reached', text: 'Upgrade to Pro for unlimited runs and un-watermarked exports.', action: { label: 'Start 14-day trial', icon: I.Spark } }),
        ))),

    h(DCArtboard, { id: 'g-composer', label: 'Composer', width: 400, height: 150, style: GAL, key: 'g13' },
      h(Frame, { w: 400, pad: 0 }, h(C.Composer, { mode: 'Create', route: 'ORYND', value: 'Create a ventilated brake disc, Ø320' }))),
  ];
}

// expose macro lines for the gallery macro card
window.__MACRO = window.SCENARIOS.preview.blocks.find(b => b.t === 'macro').lines;

// ---- task pane states ----
const PANE_STATES = [
  ['idle', 'Idle · empty'],
  ['understanding', 'Understanding'],
  ['searching', 'Searching'],
  ['planning', 'Planning'],
  ['preview', 'Preview + Approval'],
  ['executing', 'Executing'],
  ['completed', 'Completed'],
  ['validation_failed', 'Error · validation failed'],
  ['cad_disconnected', 'Error · CAD disconnected'],
  ['blocked', 'Error · subscription'],
];

function App() {
  return h(DesignCanvas, null,
    h(DCSection, { id: 'live', title: 'Live prototype', subtitle: 'Chat-first · click the tabs, the + menu, the route pill, and the settings gear — it all works' },
      h(DCArtboard, { id: 'live-pane', label: 'Interactive · 400px', width: 400, height: 820, style: PANE },
        h(window.OryndApp, null)),
      h(DCArtboard, { id: 'live-360', label: 'Narrow · 360px', width: 360, height: 820, style: PANE },
        h(window.OryndApp, null)),
      h(DCArtboard, { id: 'live-460', label: 'Wide · 460px', width: 460, height: 820, style: PANE },
        h(window.OryndApp, null)),
      h(DCArtboard, { id: 'live-600', label: 'Docked wide · 600px (2-col library)', width: 600, height: 820, style: PANE },
        h(window.OryndApp, null))),

    h(DCSection, { id: 'foundations', title: 'Foundations', subtitle: 'Dark task-pane theme derived from ORYND tokens' },
      h(DCArtboard, { id: 'tokens', label: 'Theme', width: 560, height: 'auto', style: { height: 'auto', background: 'transparent', boxShadow: 'none', borderRadius: 18, overflow: 'visible' } },
        h(Foundations, null))),

    h(DCSection, { id: 'components', title: 'Components', subtitle: 'The message & card inventory — every block the pane composes' },
      ...Gallery()),

    h(DCSection, { id: 'flow', title: 'State machine', subtitle: 'How the pieces connect: happy path + error branches' },
      h(DCArtboard, { id: 'sm', label: 'Event flow', width: 1240, height: 520, style: { background: 'var(--surface)', borderRadius: 16 } },
        h(window.FlowDiagram, null))),

    h(DCSection, { id: 'screens', title: 'Task Pane — screen states', subtitle: 'Same 400px pane, one artboard per state' },
      PANE_STATES.map(([k, label]) =>
        h(DCArtboard, { id: 'pane-' + k, label, width: 400, height: 760, style: PANE, key: k },
          h(window.TaskPane, { scenario: window.SCENARIOS[k] })))),

    h(DCSection, { id: 'library', title: 'Library & history', subtitle: 'More than chat — saved parts, reusable macros, and every run' },
      h(DCArtboard, { id: 'pane-library', label: 'Pane · Library', width: 400, height: 760, style: PANE },
        h(window.DASH.LibraryPane, {})),
      h(DCArtboard, { id: 'pane-runs', label: 'Pane · Runs', width: 400, height: 760, style: PANE },
        h(window.DASH.RunsPane, {})),
      h(DCArtboard, { id: 'pane-overview', label: 'Pane · Overview (vertical dashboard)', width: 400, height: 820, style: PANE },
        h('div', { className: 'tp', style: { width: '100%', height: '100%' } },
          h('div', { className: 'tp-shell' },
            h(window.CAD.Header, { connection: 'connected', route: 'ORYND' }),
            h(window.DASH.PaneTabs, { active: 'overview' }),
            h(window.DASH.VerticalDashboard, {})))),
      h(DCArtboard, { id: 'companion', label: 'Companion dashboard · desktop / app-mode only', width: 1180, height: 760, style: { background: 'var(--bg)', borderRadius: 16 } },
        h(window.DASH.CompanionDashboard, {}))),

    h(DCSection, { id: 'selection', title: 'Selection & cheap edits', subtitle: 'Continuing session · select in CAD → deterministic edit or model escalation' },
      window.SELECTION_STATES.map(([k, label]) =>
        h(DCArtboard, { id: 'sel-' + k, label, width: 400, height: 760, style: PANE, key: k },
          h(window.TaskPane, { scenario: window.SCENARIOS[k] })))),

    ...window.SCREEN_GROUPS.map((g) =>
      h(DCSection, { id: g.title, title: g.title, subtitle: g.subtitle, key: g.title },
        g.items.map(([k, label]) =>
          h(DCArtboard, { id: 'screen-' + k, label, width: 396, height: 880, style: PANE, key: k },
            h(window.SCREENS[k]))))),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
